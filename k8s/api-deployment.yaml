apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-docs-rag-api
  namespace: docs-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeflow-docs-rag-api
  template:
    metadata:
      labels:
        app: kubeflow-docs-rag-api
    spec:
      containers:
        - name: api
          image: kubeflow-docs-rag-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
            - name: MILVUS_URI
              value: "http://milvus.docs-agent.svc.cluster.local:19530"
            - name: MILVUS_COLLECTION
              value: "kubeflow_pdf_rag"
            - name: EMBEDDING_MODEL
              value: "sentence-transformers/all-MiniLM-L6-v2"
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: llm_provider
                  optional: true
            - name: LLM_CHAT_URL
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: llm_chat_url
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: llm_model
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: llm_api_key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: gemini_api_key
                  optional: true
            - name: GEMINI_MODEL
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: gemini_model
                  optional: true
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
