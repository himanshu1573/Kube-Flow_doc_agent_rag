apiVersion: v1
kind: Secret
metadata:
  name: rag-llm-secret
  namespace: docs-agent
type: Opaque
stringData:
  # Set this to gemini if you want the app to call Gemini directly.
  llm_provider: "gemini"

  # Gemini configuration.
  gemini_api_key: "replace-me"
  gemini_model: "gemini-2.5-flash"

  # Optional OpenAI-compatible configuration.
  llm_chat_url: ""
  llm_model: ""
  llm_api_key: ""
