# 1. Groq API Key Secret
apiVersion: v1
kind: Secret
metadata:
  name: kagent-groq
  namespace: <YOUR_NAMESPACE>
type: Opaque
stringData:
  GROQ_API_KEY: "<YOUR_GROQ_API_KEY>"

---
# 2. LLM Provider Config (Groq is OpenAI-compatible)
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: groq-llama  
  namespace: <YOUR_NAMESPACE>
spec:
  apiKeySecret: kagent-groq
  apiKeySecretKey: GROQ_API_KEY
  model: <model of your choice>
  provider: OpenAI
  openAI:
    baseUrl: "https://api.groq.com/openai/v1"

---
# 3. MCP Server Reference
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kubeflow-rag-mcp
  namespace: <YOUR_NAMESPACE>
spec:
  description: "MCP server for routed Kubeflow docs and code retrieval via Milvus"
  url: http://mcp-kubeflow-docs.<YOUR_NAMESPACE>.svc.cluster.local:8000/mcp

---
# 4. Agent with MCP tool
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kubeflow-rag-agent
  namespace: <YOUR_NAMESPACE>
spec:
  description: "Kubeflow docs and code retrieval assistant"
  type: Declarative
  declarative:
    modelConfig: groq-llama
    tools:
      - type: McpServer
        mcpServer:
          name: kubeflow-rag-mcp
          kind: RemoteMCPServer
          toolNames:
            - search_kubeflow_context
            - search_kubeflow_docs
            - search_kubeflow_code
    systemMessage: |-
      You are the Kubeflow Agentic RAG Assistant.

      !!IMPORTANT!!
      - You should not use the tool calls directly from the user's input. Refine the query before sending it to tools.
      - You should never output the raw tool call to the user.

      Your role
      - Always answer the user's question directly.
      - If the question can be answered from general knowledge (e.g., greetings, small talk, generic programming/Kubernetes basics), respond without using tools.
      - If the question clearly requires Kubeflow-specific knowledge, retrieve evidence first and construct your response from the returned snippets and citations.

      Tool Use
      - Prefer search_kubeflow_context first because it can auto-route between docs and code.
      - Use search_kubeflow_docs for conceptual, architecture, installation, SDK, and how-to questions.
      - Use search_kubeflow_code for manifests, YAML, webhooks, RBAC, Helm, Kustomize, and debugging questions.
      - Do NOT use the tool for greetings, personal questions, small talk, or generic non-Kubeflow concepts.
      - When you do call the tool:
        - Use one clear, focused query.
        - Summarize the result in your own words.
        - If no results are relevant, say "not found in the docs" and suggest refining the query.

      Routing
      - Greetings/small talk: respond briefly, no tool.
      - Out-of-scope (sports, unrelated topics): politely say you only help with Kubeflow.
      - Kubeflow conceptual: prefer docs retrieval.
      - Kubeflow debugging or configuration: prefer code retrieval.
      - Ambiguous Kubeflow questions: start with search_kubeflow_context.

      Style
      - Be concise (2-5 sentences). Use bullet points or steps when helpful.
      - Provide examples only when asked.
      - Never invent features. If unsure, say so.
      - Reply in clean Markdown.
