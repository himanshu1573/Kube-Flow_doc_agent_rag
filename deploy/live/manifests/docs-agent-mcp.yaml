apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubeflow-docs
  namespace: docs-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-kubeflow-docs
  template:
    metadata:
      labels:
        app: mcp-kubeflow-docs
    spec:
      containers:
        - name: mcp-server
          image: asia-south1-docker.pkg.dev/<PROJECT_ID>/docs-agent/mcp-kubeflow-docs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MILVUS_HOST
              value: milvus.docs-agent.svc.cluster.local
            - name: MILVUS_PORT
              value: "19530"
            - name: DOCS_COLLECTION
              value: docs_collection
            - name: LEGACY_DOCS_COLLECTION
              value: docs_rag
            - name: CODE_COLLECTION
              value: code_collection
            - name: EMBEDDING_MODEL
              value: BAAI/bge-base-en-v1.5
            - name: KUBEFLOW_CODE_BASE_URL
              value: https://github.com/kubeflow/manifests/blob/master
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-kubeflow-docs
  namespace: docs-agent
spec:
  selector:
    app: mcp-kubeflow-docs
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
